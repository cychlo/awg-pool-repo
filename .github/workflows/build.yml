name: build-apk

# Пакеты PKGARCH:=all (скрипт + JS), от таргета не зависят: собираем один раз.
# Матрица из двух таргетов давала одинаковые .apk с одинаковыми именами в релизе.
on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: 'OpenWrt release'
        default: '25.12.6'
  push:
    tags: [ 'v*' ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: mediatek/filogic
    steps:
      - uses: actions/checkout@v4

      - name: Build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools \
            rsync unzip zlib1g-dev file wget zstd curl

      - name: Resolve SDK URL
        id: sdk
        run: |
          set -e
          VER="${{ github.event.inputs.openwrt_version || '25.12.6' }}"
          BASE="https://downloads.openwrt.org/releases/$VER/targets/$TARGET"
          NAME=$(curl -fsSL "$BASE/" | grep -oE 'openwrt-sdk-[^"<>]*Linux-x86_64\.tar\.(zst|xz)' | head -n1)
          if [ -z "$NAME" ]; then echo "SDK not found at $BASE"; exit 1; fi
          echo "url=$BASE/$NAME" >> "$GITHUB_OUTPUT"
          echo "file=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download and unpack SDK
        run: |
          set -e
          curl -fL -o sdk.tar "${{ steps.sdk.outputs.url }}"
          mkdir sdk && tar -xf sdk.tar -C sdk --strip-components=1

      - name: Feeds
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Add packages
        run: |
          cp -r awg-pool sdk/package/
          cp -r luci-app-awg-pool sdk/package/

      - name: Compile
        run: |
          cd sdk
          make defconfig
          make package/awg-pool/compile V=s -j"$(nproc)"
          make package/luci-app-awg-pool/compile V=s -j"$(nproc)"

      - name: Collect
        run: |
          set -e
          mkdir -p out
          find sdk/bin/packages -name 'awg-pool-*.apk' -exec cp {} out/ \;
          find sdk/bin/packages -name 'luci-app-awg-pool-*.apk' -exec cp {} out/ \;
          ls -l out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.apk