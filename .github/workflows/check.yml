name: check

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dash shellcheck

      - name: Line endings must be LF
        run: |
          bad=0
          for f in awg-pool/files/awg-pool awg-pool/files/awg-pool.init \
                   awg-pool/files/awg-failover.config awg-pool/Makefile \
                   luci-app-awg-pool/Makefile luci-app-awg-pool/files/main.js \
                   luci-app-awg-pool/files/menu.json luci-app-awg-pool/files/acl.json \
                   tests/selftest.sh; do
            if grep -qU $'\r' "$f"; then echo "CRLF: $f"; bad=1; fi
          done
          [ "$bad" = 0 ] || { echo "Нормализуйте: git add --renormalize ."; exit 1; }

      - name: Shell syntax (dash)
        run: |
          dash -n awg-pool/files/awg-pool
          dash -n awg-pool/files/awg-pool.init
          dash -n tests/selftest.sh

      - name: shellcheck
        run: |
          shellcheck -s sh -S warning awg-pool/files/awg-pool
          shellcheck -s sh -S warning awg-pool/files/awg-pool.init

      - name: JSON validity
        run: |
          python3 -m json.tool luci-app-awg-pool/files/menu.json > /dev/null
          python3 -m json.tool luci-app-awg-pool/files/acl.json > /dev/null

      - name: License consistency
        run: |
          grep -q 'MIT License' LICENSE
          grep -q '^PKG_LICENSE:=MIT' awg-pool/Makefile
          grep -q '^PKG_LICENSE:=MIT' luci-app-awg-pool/Makefile

      - name: Name consistency
        run: |
          set -e
          grep -q 'CFG="awg-failover"' awg-pool/files/awg-pool
          grep -q "uci.load('awg-failover')" luci-app-awg-pool/files/main.js
          grep -q '"awg-failover"' luci-app-awg-pool/files/acl.json
          grep -q '/etc/config/awg-failover' awg-pool/Makefile
          grep -q '"path": "awg-pool/main"' luci-app-awg-pool/files/menu.json
          grep -q '"luci-app-awg-pool"' luci-app-awg-pool/files/menu.json
          grep -q '^PKGARCH:=all' awg-pool/Makefile
          grep -q '^PKGARCH:=all' luci-app-awg-pool/Makefile
          grep -q 'speed_fail_threshold' awg-pool/files/awg-pool
          grep -q 'speed_fail_threshold' luci-app-awg-pool/files/main.js
          grep -q 'wan_urls' awg-pool/files/awg-pool
          grep -q 'wan_urls' luci-app-awg-pool/files/main.js
          grep -q "this.super('handleSaveApply'" luci-app-awg-pool/files/main.js
          echo "consistency OK"

      - name: Mock selftest
        run: dash tests/selftest.sh